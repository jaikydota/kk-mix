[project]
name = "kk-mix"
version = "10.3.0"
description = "基于 FFmpeg 的 Windows 批量视频混剪工具（PySide6 Fluent UI）"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=44.0.0",
    "httpx>=0.27.0",
    "pillow==11.3.0",
    "pyside6>=6.11.0",
    "pyside6-fluent-widgets[full]>=1.11.2",
]

[dependency-groups]
dev = [
    "cython>=3.0.0",
    "pyinstaller==6.19.0",
    "setuptools>=75.0.0",
]

[tool.uv]
package = false
