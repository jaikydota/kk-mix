[project]
name = "han-mix"
version = "7.0.0"
description = "FFmpeg 批处理视频编辑工具"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=44.0.0",
    "fastmcp>=3.1.0",
    "moviepy==1.0.3",
    "numpy==2.0.2",
    "openai>=2.24.0",
    "pillow==11.3.0",
    "pyside6>=6.11.0",
    "pyside6-fluent-widgets[full]>=1.11.2",
]

[dependency-groups]
dev = [
    "cython>=3.0.0",
    "pyinstaller==6.19.0",
    "setuptools>=75.0.0",
]

[tool.uv]
package = false
